name: Release

permissions:
  pull-requests: write
  contents: write
  id-token: write # Required for trusted publishing

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish directly to crates.io
        required: true
        default: v2.0.18
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release
    # Ubuntu 24.04
    runs-on: ubuntu-24.04
    environment: Release-plz
    if: ${{ github.event_name == 'push' && github.repository_owner == 'kuest' && !contains(github.event.head_commit.message, '[skip release-plz]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Install Rust 1.91.1
        run: |
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          rustup default 1.91.1
          rustc --version

      - name: Run release-plz
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-existing:
    name: Publish existing crate release
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'kuest' }}
    environment: Release-plz
    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.91.1
        run: |
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          rustup default 1.91.1
          rustc --version

      - name: Check release tag
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          TAG="${{ inputs.tag }}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
